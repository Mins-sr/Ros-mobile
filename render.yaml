services:
  # Backend API with ROS2
  - type: web
    name: ros2-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ROS_DOMAIN_ID
        value: 0
    healthCheckPath: /health

